# Author: Shravan Mali
# ESPHome firmware for Aura v0 Voice Assistant on ESP32-S3 DevKitC-1

substitutions:
  name: "voice-assistant"
  friendly_name: "Voice Assistant"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - micro_wake_word.start:

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 40MHz

wifi:
  power_save_mode: none
  networks:
    - ssid: !secret wifi_ssid_primary
      password: !secret wifi_password_primary
      priority: 10.0
    - ssid: !secret wifi_ssid_secondary
      password: !secret wifi_password_secondary
      priority: 5.0

  # Fallback hotspot in case local Wi-Fi router disconnects
  ap:
    ssid: "Voice Assistant Fallback"
    password: !secret wifi_fallback_password

captive_portal:

logger:
  hardware_uart: UART0
  level: INFO

api:

ota:
  - platform: esphome

button:
  - platform: template
    name: "Force Start Mic"
    id: force_start_mic
    on_press:
      - voice_assistant.start:
  - platform: template
    name: "Restart Wake Word"
    id: restart_wake_word
    on_press:
      - micro_wake_word.start:

# Two separate I2S buses so audio streaming doesn't lock up the watchdog
i2s_audio:
  # INMP441 Mic Clock Bus
  - id: i2s_in
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO16
  # MAX98357A Speaker Clock Bus
  - id: i2s_out
    i2s_lrclk_pin: GPIO6
    i2s_bclk_pin: GPIO5

# INMP441 MEMS microphone on breadboard
microphone:
  - platform: i2s_audio
    id: board_mic
    i2s_audio_id: i2s_in
    adc_type: external
    i2s_din_pin: GPIO17
    pdm: false
